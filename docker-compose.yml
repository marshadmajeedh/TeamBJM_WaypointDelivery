version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: waypoint_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waypoint}
      POSTGRES_USER: ${POSTGRES_USER:-waypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-waypoint} -d ${POSTGRES_DB:-waypoint}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: waypoint_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-waypoint}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-waypoint}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace_with_secure_secret}
      CORS_ORIGIN: '*'
      SEED_STORE_MANAGER_PASSWORD: ${SEED_STORE_MANAGER_PASSWORD:-change_me}
      SEED_DISPATCHER_PASSWORD: ${SEED_DISPATCHER_PASSWORD:-change_me}
      SEED_LOADER_PASSWORD: ${SEED_LOADER_PASSWORD:-change_me}
      SEED_DRIVER_PASSWORD: ${SEED_DRIVER_PASSWORD:-change_me}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: waypoint_web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
